
name: Trigger Byzan Converter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_byzan_converter]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Byzan Systems Workflow
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/Byzan-Systems/17TJ0027-2/actions/workflows/hdfc_automation2.yml/dispatches \
            -f ref="main"
